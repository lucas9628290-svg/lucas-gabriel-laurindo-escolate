<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level Dead 3D</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
    font-family:Arial;
}

#hud{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    font-size:28px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
}

#mensagem{
    position:absolute;
    width:100%;
    top:50%;
    text-align:center;
    color:white;
    font-size:45px;
    transform:translateY(-50%);
    display:none;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.164/build/three.min.js"></script>

</head>
<body>

<div id="hud">
Fase 1<br>
Mortes: <span id="mortes">0</span>
</div>

<div id="mensagem"></div>

<script src="script.js"></script>

</body>
</html>
