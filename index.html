<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brasil 2026 DLS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:white;
    overflow-x:hidden;
    min-height:100vh;
}

/* FUNDO PRINCIPAL */

.bg{
    position:fixed;
    inset:0;
    background-image:
    linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.55)),
    url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1600&auto=format&fit=crop');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    z-index:-2;
}

/* TOPO */

.topo{
    width:100%;
    padding:15px 20px;
    background:#111;
    border-bottom:2px solid #19ff72;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
}

.topo h1{
    color:#19ff72;
    font-size:28px;
    text-shadow:0 0 15px #19ff72;
}

/* BOTÕES */

.bg-btn{
    background:#19ff72;
    color:#000;
    padding:10px 18px;
    border-radius:12px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.bg-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #19ff72;
}

.bg-btn input{
    display:none;
}

/* CONTAINER */

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:30px;
    padding:20px;
    flex-wrap:wrap;
}

/* CAMPO */

.campo{
    width:700px;
    height:1000px;
    background:
    linear-gradient(rgba(0,0,0,.1),rgba(0,0,0,.1)),
    url('https://i.imgur.com/y8b6K9F.png');
    background-size:cover;
    background-position:center;
    border:4px solid #19ff72;
    border-radius:25px;
    position:relative;
    overflow:hidden;
    box-shadow:0 0 30px #19ff72;
}

/* ESCURECIMENTO LEVE */

.campo::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.12);
    z-index:2;
}

/* FUNDO ATRÁS DAS CARTAS */

.campo-overlay{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    opacity:1;
    z-index:1;
}

/* BOTÃO FUNDO CAMPO */

.campo-bg-btn{
    position:absolute;
    top:15px;
    right:15px;
    z-index:20;
    background:#19ff72;
    color:#000;
    padding:8px 14px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 10px #19ff72;
}

.campo-bg-btn input{
    display:none;
}

/* CARTAS */

.player{
    position:absolute;
    width:95px;
    text-align:center;
    transition:.3s;
    z-index:5;
}

.player:hover{
    transform:scale(1.08);
}

.card{
    width:95px;
    height:120px;
    border-radius:16px;
    border:2px solid #19ff72;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    box-shadow:0 0 15px #19ff72;
    background:#111;
}

.card input{
    display:none;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* FUNDO DAS CARTAS */

.upload-text{
    display:none;
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    background-image:url('https://i.imgur.com/3ZQ3Z6H.png');
}

/* NOMES */

.nome{
    margin-top:6px;
    font-size:13px;
    font-weight:bold;
    text-shadow:0 0 10px #000;
}

.pos{
    font-size:11px;
    color:#19ff72;
    text-shadow:0 0 10px #000;
}

/* POSIÇÕES */

.gol{top:850px;left:300px;}

.z1{top:680px;left:80px;}
.z2{top:680px;left:300px;}
.z3{top:680px;left:520px;}

.l1{top:500px;left:20px;}
.l2{top:500px;left:580px;}

.m1{top:430px;left:180px;}
.m2{top:430px;left:420px;}

.a1{top:220px;left:120px;}
.a2{top:220px;left:470px;}

.atk{top:80px;left:300px;}

/* RESERVAS */

.reservas{
    width:320px;
    background:#111;
    border:3px solid #19ff72;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 25px #19ff72;
}

.reservas h2{
    text-align:center;
    margin-bottom:20px;
    color:#19ff72;
}

.banco{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

/* RESPONSIVO */

@media(max-width:900px){

    .campo{
        transform:scale(.75);
        transform-origin:top center;
        height:760px;
    }

}

</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="topo">

    <h1>🇧🇷 BRASIL 2026 DLS</h1>

    <!-- FUNDO GERAL -->
    <label class="bg-btn">
        🖼️ Fundo Geral
        <input type="file" accept="image/*" id="backgroundInput">
    </label>

</div>

<div class="container">

    <!-- CAMPO -->

    <div class="campo">

        <!-- BOTÃO FUNDO ATRÁS DAS CARTAS -->
        <label class="campo-bg-btn">
            Fundo Campo
            <input type="file" accept="image/*" id="campoBackground">
        </label>

        <!-- IMAGEM ATRÁS DAS CARTAS -->
        <div class="campo-overlay" id="campoOverlay"></div>

        <!-- TITULARES -->

        <div class="player gol">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Alisson</div>
            <div class="pos">GOL</div>
        </div>

        <div class="player z1">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Marquinhos</div>
            <div class="pos">ZAG</div>
        </div>

        <div class="player z2">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Gabriel Magalhães</div>
            <div class="pos">ZAG</div>
        </div>

        <div class="player z3">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Militão</div>
            <div class="pos">ZAG</div>
        </div>

        <div class="player l1">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Yan Couto</div>
            <div class="pos">LD</div>
        </div>

        <div class="player l2">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Carlos Augusto</div>
            <div class="pos">LE</div>
        </div>

        <div class="player m1">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Bruno Guimarães</div>
            <div class="pos">MC</div>
        </div>

        <div class="player m2">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Paquetá</div>
            <div class="pos">MEI</div>
        </div>

        <div class="player a1">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Vini Jr</div>
            <div class="pos">PE</div>
        </div>

        <div class="player a2">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Rodrygo</div>
            <div class="pos">PD</div>
        </div>

        <div class="player atk">
            <label class="card">
                <input type="file" accept="image/*" onchange="loadImage(event)">
                <img>
                <div class="upload-text"></div>
            </label>
            <div class="nome">Endrick</div>
            <div class="pos">ATA</div>
        </div>

    </div>

    <!-- RESERVAS -->

    <div class="reservas">

        <h2>RESERVAS</h2>

        <div class="banco">

            <div>
                <label class="card">
                    <input type="file" accept="image/*" onchange="loadImage(event)">
                    <img>
                    <div class="upload-text"></div>
                </label>
                <div class="nome">Bento</div>
            </div>

            <div>
                <label class="card">
                    <input type="file" accept="image/*" onchange="loadImage(event)">
                    <img>
                    <div class="upload-text"></div>
                </label>
                <div class="nome">Bremer</div>
            </div>

            <div>
                <label class="card">
                    <input type="file" accept="image/*" onchange="loadImage(event)">
                    <img>
                    <div class="upload-text"></div>
                </label>
                <div class="nome">Beraldo</div>
            </div>

            <div>
                <label class="card">
                    <input type="file" accept="image/*" onchange="loadImage(event)">
                    <img>
                    <div class="upload-text"></div>
                </label>
                <div class="nome">João Gomes</div>
            </div>

            <div>
                <label class="card">
                    <input type="file" accept="image/*" onchange="loadImage(event)">
                    <img>
                    <div class="upload-text"></div>
                </label>
                <div class="nome">Martinelli</div>
            </div>

            <div>
                <label class="card">
                    <input type="file" accept="image/*" onchange="loadImage(event)">
                    <img>
                    <div class="upload-text"></div>
                </label>
                <div class="nome">Andrey Santos</div>
            </div>

        </div>

    </div>

</div>

<script>

/* FOTO DAS CARTAS */

function loadImage(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const card = event.target.parentElement;

        card.querySelector("img").src = e.target.result;

    };

    reader.readAsDataURL(file);

}

/* TROCAR FUNDO GERAL */

const bgInput = document.getElementById("backgroundInput");
const bg = document.getElementById("bg");

bgInput.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        bg.style.backgroundImage = `
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url(${event.target.result})
        `;

    };

    reader.readAsDataURL(file);

});

/* TROCAR FUNDO ATRÁS DAS CARTAS */

const campoInput = document.getElementById("campoBackground");
const campoOverlay = document.getElementById("campoOverlay");

campoInput.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        campoOverlay.style.backgroundImage = `
        url(${event.target.result})
        `;

    };

    reader.readAsDataURL(file);

});

</script>

</body>
</html>
