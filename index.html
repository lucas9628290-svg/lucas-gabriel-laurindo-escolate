<!-- PERFIL DO ALUNO -->
<div class="profile-area">

    <label for="photoInput" style="cursor:pointer">
        <img
            id="profilePhoto"
            class="profile-photo"
            src="https://placehold.co/200x200/10283e/00c8ff?text=LUCAS"
            alt="Foto de perfil">
    </label>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        hidden>

    <div class="profile-info">
        <h2>LUCAS GABRIEL</h2>
        <p>ALUNO • MINHA MOCHILA DIGITAL</p>
    </div>

</div>

<script>
const photoInput = document.getElementById("photoInput");
const profilePhoto = document.getElementById("profilePhoto");

const savedPhoto = localStorage.getItem("lucas_profile_photo");

if (savedPhoto) {
    profilePhoto.src = savedPhoto;
}

photoInput.addEventListener("change", function() {
    const file = this.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
        alert("Escolha uma imagem válida!");
        return;
    }

    if (file.size > 3 * 1024 * 1024) {
        alert("Escolha uma imagem de até 3 MB.");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(event) {
        try {
            localStorage.setItem(
                "lucas_profile_photo",
                event.target.result
            );

            profilePhoto.src = event.target.result;
        } catch(error) {
            alert("Não foi possível salvar a foto.");
        }
    };

    reader.readAsDataURL(file);
});
</script>
